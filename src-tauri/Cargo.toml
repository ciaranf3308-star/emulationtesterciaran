[package]
name = "crystal-frontend"
version = "3.5.0"
description = "Crystal Frontend – premium next-gen gaming OS (Tauri v2) – real machine runtime"
authors = ["ciaranf3308-star"]
license = "MIT"
repository = "https://github.com/ciaranf3308-star/emulationtesterciaran"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
walkdir = "2"
quick-xml = { version = "0.31", features = ["serialize"] }
regex = "1"
glob = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
