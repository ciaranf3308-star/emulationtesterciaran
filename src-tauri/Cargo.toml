[package]
name = "crystal-frontend"
version = "4.5.0"
description = "Crystal Frontend – premium next-gen gaming OS (Tauri v2) – real machine runtime"
authors = ["ciaranf3308-star"]
license = "MIT"
repository = "https://github.com/ciaranf3308-star/emulationtesterciaran"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
walkdir = "2"
quick-xml = { version = "0.31", features = ["serialize"] }
regex = "1"
glob = "0.3"
chrono = { version = "0.4", features = ["clock"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
sysinfo = "0.33"
